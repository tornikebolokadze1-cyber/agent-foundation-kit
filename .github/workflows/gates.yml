# The kit's own pull-request check (owner, 2026-10-11): every PR — and every push to main — runs every gate
# and the drill on Windows, the system the engine is built for. A green run is what lets a PR merge by itself.
# Only in this repository: a project made from the template skips this job (its commits are checked by
# .githooks/pre-commit on the person's own machine), so nobody's Actions minutes are spent.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: github.repository == 'tornikebolokadze1-cyber/agent-foundation-kit'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Every gate and the drill
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          export ENGINE_PYTHON="$(command -v python)"
          "$ENGINE_PYTHON" --version
          "$ENGINE_PYTHON" tools/gates/gate.py
