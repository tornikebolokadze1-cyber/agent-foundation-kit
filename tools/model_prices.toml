# API list prices in USD per million tokens — the one place tools/cache_cost.py reads them from (ADR-0010).
# Source: Anthropic's pricing page — platform.claude.com/docs/en/about-claude/pricing, the "Model pricing" table,
# read 2026-11-10. Every number below stands in that table; none is derived.
# A cache write costs input × write_5m (5-minute cache) or input × write_1h (1-hour cache): the table's two write
# columns are exactly these multiples in every row. A cache read costs cache_read, and that is not one multiple —
# the page gives 0.025x of input for Fable 5.2 and 5.1, 0.05x for Opus 5.5 and Sonnet 5.5, 0.1x for the rest.
# Not priced here: fast mode (the page lists $16 / $80 per million input / output tokens for Fable 5.2 and $8 / $40
# for Opus 5.5) and US-only inference (1.1x). cache_cost.py reads the model's name and the token counts only, so a
# call made either way is counted at the standard price below — its sum is then a floor, not the list price.
# Change a price here only. A model missing from this file is reported as UNPRICED, never counted as free.
source = "Anthropic pricing page (platform.claude.com/docs/en/about-claude/pricing), read 2026-11-10"
write_5m = 1.25
write_1h = 2.0

[models.claude-fable-5-2]
input = 8.0
output = 40.0
cache_read = 0.20

[models.claude-fable-5-1]
input = 10.0
output = 50.0
cache_read = 0.25

[models.claude-fable-5]
input = 10.0
output = 50.0
cache_read = 1.0

[models.claude-opus-5-5]
input = 4.0
output = 20.0
cache_read = 0.20

[models.claude-opus-5]
input = 5.0
output = 25.0
cache_read = 0.50

[models.claude-opus-4-8]
input = 5.0
output = 25.0
cache_read = 0.50

[models.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read = 0.10

[models.claude-sonnet-5]
input = 2.0
output = 10.0
cache_read = 0.20

[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
long_threshold = 100000  # a prompt longer than this is billed at the long rates below
long_input = 0.50
long_output = 2.50
long_cache_read = 0.05

[models.claude-haiku-4-5]
input = 1.0
output = 5.0
cache_read = 0.10
