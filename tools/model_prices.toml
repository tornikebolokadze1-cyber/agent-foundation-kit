# API list prices in USD per million tokens — the one place tools/cache_cost.py reads them from (ADR-0010).
# Source: Anthropic's model table in the claude-api reference, cached 2026-10-06 (read 2026-10-10).
# A cache write costs input × write_5m (5-minute cache) or input × write_1h (1-hour cache); a cache read costs
# cache_read. A value marked "0.1x" is derived from the documented rule "cache reads cost ~0.1x base input",
# because the table gives no separate number for that model.
# Change a price here only. A model missing from this file is reported as UNPRICED, never counted as free.
